services:
  docs-screenshots-runner:
    build:
      context: .
      dockerfile: Dockerfile.docs-screenshots
      args:
        BUN_VERSION: "1.3.14"
        PLAYWRIGHT_VERSION: "1.60.0"
    environment:
      CONBENCH_DOCS_SCREENSHOT_BASE_URL: "http://server:8080"
      CONBENCH_DOCS_SCREENSHOT_OUT_DIR: "/screenshots"
      CONBENCH_DOCS_SCREENSHOT_PUBLIC_BASE_URL: "${CONBENCH_DOCS_SCREENSHOT_PUBLIC_BASE_URL:?CONBENCH_DOCS_SCREENSHOT_PUBLIC_BASE_URL must be set}"
      HOME: "/tmp"
    user: "${CONBENCH_DOCS_SCREENSHOT_UID:-0}:${CONBENCH_DOCS_SCREENSHOT_GID:-0}"
    volumes:
      - type: bind
        source: "${CONBENCH_DOCS_SCREENSHOT_OUT_DIR:?CONBENCH_DOCS_SCREENSHOT_OUT_DIR must be set}"
        target: /screenshots
    depends_on:
      server:
        condition: service_healthy
