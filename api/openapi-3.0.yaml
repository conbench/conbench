components:
  schemas:
    Aggregates:
      additionalProperties: false
      properties:
        iqr:
          format: double
          nullable: true
          type: number
        max:
          format: double
          nullable: true
          type: number
        mean:
          format: double
          nullable: true
          type: number
        median:
          format: double
          nullable: true
          type: number
        min:
          format: double
          nullable: true
          type: number
        q1:
          format: double
          nullable: true
          type: number
        q3:
          format: double
          nullable: true
          type: number
        stdev:
          format: double
          nullable: true
          type: number
      required:
        - mean
        - min
        - max
        - median
        - q1
        - q3
        - stdev
        - iqr
      type: object
    AlertEventView:
      additionalProperties: false
      properties:
        commit_sha:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          type: string
        kind:
          type: string
        report_url:
          type: string
        repository:
          type: string
        rule_id:
          type: string
        run_id:
          type: string
        status:
          type: string
        status_reason:
          type: string
        summary: {}
      required:
        - id
        - rule_id
        - kind
        - status
        - status_reason
        - repository
        - report_url
        - summary
        - created_at
      type: object
    AlertRuleBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AlertRuleBody.json
          format: uri
          readOnly: true
          type: string
        baseline:
          type: string
        enabled:
          type: boolean
        name:
          type: string
        repository:
          type: string
        run_reason:
          type: string
        threshold:
          format: double
          type: number
        threshold_z:
          format: double
          type: number
      required:
        - name
        - repository
      type: object
    AlertRuleView:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/AlertRuleView.json
          format: uri
          readOnly: true
          type: string
        baseline:
          type: string
        created_at:
          format: date-time
          type: string
        enabled:
          type: boolean
        id:
          type: string
        last_evaluated_at:
          format: date-time
          type: string
        name:
          type: string
        repository:
          type: string
        run_reason:
          type: string
        state:
          type: string
        threshold:
          format: double
          type: number
        threshold_z:
          format: double
          type: number
        updated_at:
          format: date-time
          type: string
        user_id:
          type: string
      required:
        - id
        - user_id
        - name
        - repository
        - baseline
        - threshold
        - threshold_z
        - enabled
        - state
        - created_at
        - updated_at
      type: object
    CIReport:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CIReport.json
          format: uri
          readOnly: true
          type: string
        baseline:
          type: string
        commit_sha:
          nullable: true
          type: string
        missing_run_ids:
          items:
            type: string
          nullable: true
          type: array
        report_url:
          type: string
        repository:
          type: string
        runs:
          items:
            $ref: "#/components/schemas/CIReportRun"
          nullable: true
          type: array
        selected_run_ids:
          items:
            type: string
          nullable: true
          type: array
        status:
          enum:
            - success
            - failure
            - action_required
            - skipped
          type: string
        status_reason:
          type: string
        summary:
          $ref: "#/components/schemas/CIReportSummary"
        threshold:
          format: double
          type: number
        threshold_z:
          format: double
          type: number
      required:
        - repository
        - commit_sha
        - selected_run_ids
        - missing_run_ids
        - baseline
        - status
        - status_reason
        - threshold
        - threshold_z
        - summary
        - runs
        - report_url
      type: object
    CIReportAnalysis:
      additionalProperties: false
      nullable: true
      properties:
        lookback_z_score:
          $ref: "#/components/schemas/LookbackAnalysis"
        pairwise:
          $ref: "#/components/schemas/PairwiseAnalysis"
      required:
        - pairwise
        - lookback_z_score
      type: object
    CIReportBaselineError:
      additionalProperties: false
      nullable: true
      properties:
        baseline:
          type: string
        code:
          type: string
        commit_sha:
          nullable: true
          type: string
        message:
          type: string
        run_id:
          type: string
        searched_ancestor_limit:
          format: int64
          type: integer
        searched_commit_shas:
          items:
            type: string
          nullable: true
          type: array
      required:
        - code
        - message
        - run_id
        - baseline
        - commit_sha
      type: object
    CIReportBaselineSide:
      additionalProperties: false
      nullable: true
      properties:
        commit_sha:
          nullable: true
          type: string
        commit_timestamp:
          format: date-time
          nullable: true
          type: string
        result_id:
          type: string
        result_timestamp:
          format: date-time
          type: string
        run_id:
          type: string
        single_value_summary:
          format: double
          nullable: true
          type: number
        single_value_summary_type:
          type: string
      required:
        - result_id
        - run_id
        - result_timestamp
        - commit_sha
        - commit_timestamp
        - single_value_summary
        - single_value_summary_type
      type: object
    CIReportComparison:
      additionalProperties: false
      properties:
        analysis:
          $ref: "#/components/schemas/CIReportAnalysis"
        baseline:
          $ref: "#/components/schemas/CIReportBaselineSide"
        contender:
          $ref: "#/components/schemas/CIReportSide"
        context:
          additionalProperties: {}
          type: object
        error:
          additionalProperties: {}
          nullable: true
          type: object
        hardware:
          $ref: "#/components/schemas/Hardware"
        history_fingerprint:
          type: string
        info:
          additionalProperties: {}
          type: object
        less_is_better:
          nullable: true
          type: boolean
        links:
          $ref: "#/components/schemas/CIReportRowLinks"
        name:
          type: string
        reason:
          type: string
        status:
          enum:
            - regressed
            - improved
            - stable
            - insufficient
            - errored
            - missing_baseline
            - not_comparable
          type: string
          x-enum-varnames:
            - CIReportComparisonStatusRegressed
            - CIReportComparisonStatusImproved
            - CIReportComparisonStatusStable
            - CIReportComparisonStatusInsufficient
            - CIReportComparisonStatusErrored
            - CIReportComparisonStatusMissingBaseline
            - CIReportComparisonStatusNotComparable
        tags:
          additionalProperties: {}
          type: object
        unit:
          nullable: true
          type: string
      required:
        - status
        - name
        - tags
        - context
        - info
        - hardware
        - history_fingerprint
        - unit
        - less_is_better
        - contender
        - baseline
        - analysis
        - error
        - links
      type: object
    CIReportRowLinks:
      additionalProperties: false
      properties:
        compare:
          type: string
        result:
          type: string
        series:
          type: string
      required:
        - result
        - series
      type: object
    CIReportRun:
      additionalProperties: false
      properties:
        baseline_commit:
          $ref: "#/components/schemas/Commit"
        baseline_error:
          $ref: "#/components/schemas/CIReportBaselineError"
        baseline_run_id:
          nullable: true
          type: string
        commit:
          $ref: "#/components/schemas/Commit"
        commits_skipped:
          items:
            type: string
          nullable: true
          type: array
        comparisons:
          items:
            $ref: "#/components/schemas/CIReportComparison"
          nullable: true
          type: array
        run_id:
          type: string
        run_reason:
          nullable: true
          type: string
        run_tags:
          additionalProperties: {}
          type: object
      required:
        - run_id
        - run_tags
        - run_reason
        - commit
        - baseline_run_id
        - baseline_commit
        - commits_skipped
        - baseline_error
        - comparisons
      type: object
    CIReportSide:
      additionalProperties: false
      properties:
        commit_sha:
          nullable: true
          type: string
        commit_timestamp:
          format: date-time
          nullable: true
          type: string
        error:
          additionalProperties: {}
          nullable: true
          type: object
        result_id:
          type: string
        result_timestamp:
          format: date-time
          type: string
        run_id:
          type: string
        single_value_summary:
          format: double
          nullable: true
          type: number
        single_value_summary_type:
          type: string
      required:
        - result_id
        - run_id
        - result_timestamp
        - commit_sha
        - commit_timestamp
        - error
        - single_value_summary
        - single_value_summary_type
      type: object
    CIReportSummary:
      additionalProperties: false
      properties:
        analyzed:
          format: int64
          type: integer
        benchmark_errors:
          format: int64
          type: integer
        compared:
          format: int64
          type: integer
        contender_results:
          format: int64
          type: integer
        improvements:
          format: int64
          type: integer
        missing_baseline:
          format: int64
          type: integer
        missing_runs:
          format: int64
          type: integer
        not_comparable:
          format: int64
          type: integer
        regressions:
          format: int64
          type: integer
        runs:
          format: int64
          type: integer
      required:
        - runs
        - missing_runs
        - contender_results
        - compared
        - analyzed
        - regressions
        - improvements
        - benchmark_errors
        - missing_baseline
        - not_comparable
