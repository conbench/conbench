info:
  title: Conbench
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/alert-rules:
    get:
      operationId: list-alert-rules
      parameters:
        - description: Bearer token.
          in: header
          name: Authorization
          schema:
            description: Bearer token.
            type: string
        - in: cookie
          name: conbench_session
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAlertRulesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the caller's alert rules
    post:
      operationId: create-alert-rule
      parameters:
        - description: Bearer token.
          in: header
          name: Authorization
          schema:
            description: Bearer token.
            type: string
        - in: cookie
          name: conbench_session
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleView"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create an alert rule
  /api/alert-rules/{id}:
    delete:
      operationId: delete-alert-rule
      parameters:
        - description: Bearer token.
          in: header
          name: Authorization
          schema:
            description: Bearer token.
            type: string
        - in: cookie
          name: conbench_session
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete one alert rule
    get:
      operationId: get-alert-rule
      parameters:
        - description: Bearer token.
          in: header
          name: Authorization
          schema:
            description: Bearer token.
            type: string
        - in: cookie
          name: conbench_session
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get one alert rule
    put:
      operationId: update-alert-rule
      parameters:
        - description: Bearer token.
          in: header
          name: Authorization
          schema:
            description: Bearer token.
            type: string
        - in: cookie
          name: conbench_session
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRuleView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update one alert rule
  /api/alert-rules/{id}/events:
    get:
      operationId: list-alert-events
      parameters:
        - description: Bearer token.
          in: header
          name: Authorization
          schema:
            description: Bearer token.
            type: string
        - in: cookie
          name: conbench_session
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: Maximum events to return.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum events to return.
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAlertEventsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List alert events for one rule
  /api/auth/callback:
    get:
      operationId: auth-callback
      parameters:
        - explode: false
          in: query
          name: state
          schema:
            type: string
        - explode: false
          in: query
          name: code
          schema:
            type: string
        - in: cookie
          name: conbench_pending
          schema:
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: OIDC callback
  /api/auth/capabilities:
    get:
      operationId: auth-capabilities
      parameters:
        - in: cookie
          name: conbench_session
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Browser-visible auth capabilities
  /api/auth/cli-exchange:
    post:
      operationId: auth-cli-exchange
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliExchangeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliExchangeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Exchange a CLI login code for an API token
  /api/auth/cli-start:
    get:
      operationId: auth-cli-start
      parameters:
        - explode: false
          in: query
          name: redirect_uri
          schema:
            type: string
        - explode: false
          in: query
          name: state
          schema:
            type: string
        - in: cookie
          name: conbench_session
          schema:
            type: string
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Begin CLI loopback login
  /api/auth/login:
    get:
      operationId: auth-login
      responses:
        "302":
          description: Found
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Begin OIDC login
  /api/auth/logout:
    post:
      operationId: auth-logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Log out
  /api/benchmark-results:
    get:
      operationId: list-benchmark-results
      parameters:
        - description: Filter by run id.
          explode: false
          in: query
          name: run_id
          schema:
            description: Filter by run id.
            type: string
        - description: Filter by batch id.
          explode: false
          in: query
          name: batch_id
          schema:
            description: Filter by batch id.
            type: string
        - description: Filter by run reason.
          explode: false
          in: query
          name: run_reason
          schema:
            description: Filter by run reason.
            type: string
        - description: Lower bound (inclusive), RFC3339.
          explode: false
          in: query
          name: earliest_timestamp
          schema:
            description: Lower bound (inclusive), RFC3339.
            type: string
        - description: Upper bound (inclusive), RFC3339.
          explode: false
          in: query
          name: latest_timestamp
          schema:
            description: Upper bound (inclusive), RFC3339.
            type: string
        - description: Pagination cursor (previous page's last id).
          explode: false
          in: query
          name: cursor
          schema:
            description: Pagination cursor (previous page's last id).
            type: string
        - description: Page size (max 1000).
          explode: false
          in: query
          name: page_size
          schema:
            default: 100
            description: Page size (max 1000).
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultPage"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List and search benchmark results
  /api/benchmark-results/{id}:
    delete:
      operationId: delete-result
      parameters:
        - description: Bearer token, e.g. 'Bearer <token>'.
          in: header
          name: Authorization
          schema:
            description: Bearer token, e.g. 'Bearer <token>'.
            type: string
        - in: cookie
          name: conbench_session
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a benchmark result
    get:
      operationId: get-benchmark-result
      parameters:
        - description: Benchmark result id.
          in: path
          name: id
          required: true
          schema:
            description: Benchmark result id.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultDetail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a benchmark result
    put:
      operationId: update-result
      parameters:
        - description: Bearer token, e.g. 'Bearer <token>'.
          in: header
          name: Authorization
          schema:
            description: Bearer token, e.g. 'Bearer <token>'.
            type: string
        - in: cookie
          name: conbench_session
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResultInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultDetail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a benchmark result's change_annotations
  /api/ci/report:
    get:
      operationId: get-ci-report
      parameters:
        - description: Repository URL.
          explode: false
          in: query
          name: repository
          schema:
            description: Repository URL.
            type: string
        - description: Commit SHA.
          explode: false
          in: query
          name: commit_sha
          schema:
            description: Commit SHA.
            type: string
        - description: Comma-separated contender run IDs.
          explode: false
          in: query
          name: run_ids
          schema:
            description: Comma-separated contender run IDs.
            type: string
        - description: Comma-separated explicit baseline run IDs, paired by position with run_ids.
          explode: false
          in: query
          name: baseline_run_ids
          schema:
            description: Comma-separated explicit baseline run IDs, paired by position with run_ids.
            type: string
        - description: Automatic baseline selector.
          explode: false
          in: query
          name: baseline
          schema:
            description: Automatic baseline selector.
            enum:
              - fork_point
              - parent
              - latest_default
            type: string
        - description: Pairwise percent-change threshold. Defaults to 5.
          explode: false
          in: query
          name: threshold
          schema:
            description: Pairwise percent-change threshold. Defaults to 5.
            format: double
            type: number
        - description: Lookback z-score threshold. Defaults to 5.
          explode: false
          in: query
          name: threshold_z
          schema:
            description: Lookback z-score threshold. Defaults to 5.
            format: double
            type: number
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CIReport"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a PR/CI benchmark report
  /api/compare/benchmark-results:
    get:
      operationId: compare-benchmark-results
      parameters:
        - description: Baseline benchmark result id.
          explode: false
          in: query
          name: baseline_result_id
          required: true
          schema:
            description: Baseline benchmark result id.
            type: string
        - description: Contender benchmark result id.
          explode: false
          in: query
          name: contender_result_id
          required: true
          schema:
            description: Contender benchmark result id.
