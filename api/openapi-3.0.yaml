        created_at:
          format: date-time
          type: string
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        token:
          description: The plaintext secret. Shown once; store it now.
          type: string
      required:
        - id
        - name
        - token
        - prefix
        - created_at
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    GitHubInfo:
      additionalProperties: false
      properties:
        branch:
          description: Branch in org:branch form; only for non-default-branch runs outside PRs.
          nullable: true
          type: string
        commit:
          type: string
        pr_number:
          description: Pull request number; used to resolve the branch via the GitHub API.
          format: int64
          nullable: true
