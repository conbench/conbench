name: Build and upload Python SDK to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.2"
          enable-cache: true
      - run: cd sdk/python && uv python install 3.12
      - name: Set SDK release version
        run: |
          python - <<'PY'
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          date = datetime.now(timezone.utc)
          version = f"{date.year}.{date.month}.{date.day}.{run_number}.{run_attempt}"
          legacy_floor = (2023, 4, 10)
          if tuple(int(part) for part in version.split(".")) <= legacy_floor:
              raise SystemExit(f"{version} does not supersede legacy conbench {legacy_floor}")

          path = Path("sdk/python/pyproject.toml")
          text = path.read_text()
          updated, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("expected exactly one project version in sdk/python/pyproject.toml")
          path.write_text(updated)

          lock_path = Path("sdk/python/uv.lock")
          lock_text = lock_path.read_text()
          lock_updated, lock_count = re.subn(
              r'(?ms)(\[\[package\]\]\nname = "conbench"\nversion = ")[^"]+(")',
              rf"\g<1>{version}\2",
              lock_text,
              count=1,
          )
          if lock_count != 1:
              raise SystemExit("expected exactly one conbench lock version in sdk/python/uv.lock")
          lock_path.write_text(lock_updated)

          with Path(os.environ["GITHUB_ENV"]).open("a") as env:
              env.write(f"SDK_VERSION={version}\n")
          print(f"SDK_VERSION={version}")
          PY
      - name: Check and build Python SDK artifacts
        env:
          CONBENCH_PYTHON_SDK_KEEP_DIST: "1"
        run: make python-sdk-check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conbench-python-sdk-${{ env.SDK_VERSION }}
          path: sdk/python/dist/*
          if-no-files-found: error
          retention-days: 14
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
